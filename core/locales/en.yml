# English vocabulary for locale-sensitive gate checks.
# Gates check NEUTRAL SENTINELS (RESULT:, STATE:, PASS/FAIL…) — these lists only
# localize the free-prose patterns that cannot be sentinels.

# Phrases that void an evidence manifest: hedging instead of measuring.
hedge_phrases:
  - "looks about right"
  - "mostly matches"
  - "basically identical"
  - "seems fine"
  - "roughly the same"
  - "close enough"

# Verbs/markers that mark a QA test case as a WRITE (requires db_verify.md).
# Uppercase-insensitive matching; sentinel DB_VERIFY and SQL verbs are built in.
write_verbs:
  - "CREATE NEW"
  - "CREATES A"
  - "TOP-UP"
  - "TOP UP"
  - "PLACE ORDER"
  - "PLACES AN ORDER"
  - "WRITES TO DB"
