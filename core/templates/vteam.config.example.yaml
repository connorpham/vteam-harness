# vteam.config.yaml — the single contract between your repo and the framework.
# Every gate, workflow and adapter reads from here (via core/scripts/lib).
# House of record for the schema: docs/DESIGN.md §2.

version: 1

project:
  name: My Project
  key: PROJ              # ticket prefix (PROJ-123); used by branch grammar, gates, ledgers
  language: en           # owner-facing output locale (framework internals stay English)
  # go_live: 2027-01-01  # optional; desk report leads with progress against it
  adopted: 2026-01-01    # install date; grandfathering thresholds anchor here

paths:
  specs: docs/specs      # sharded requirement oracle + INDEX.md + changes.md
  backlog: docs/backlog  # markdown-tracker tickets (one .md per ticket)
  pm: docs/pm            # decisions.md, log.md, sessions/, acceptance.md, plan.yaml
  qa: docs/qa            # knowledge-base.md, known-issues.md
  adr: docs/adr
  team: docs/team        # doctrine rendered at install time
  design: docs/design
  evidence: evd          # evd/<KEY>/ = QA lane · evd/<KEY>/dev/ = DEV lane

specs:
  sources: []            # the ORIGINAL spec documents BA shards from — verbatim_gate
                         # compares shards in paths.specs against these; never point
                         # it at paths.specs itself (self-comparison is self-grading)

docs:
  task_context:          # extra background /dev reads at T1, keyed by ticket label/type
    always: []           # read for EVERY ticket, e.g. [docs/architecture.md]
    by_label: {}         # label/type (lowercase) -> file list; mapped-but-missing files
                         # are reported LOUDLY in the task sheet, never guessed

stack:
  profile: generic       # generic | node | python | nextjs-prisma  → profiles/<name>/gates.yaml
  package_manager: npm

git:
  protected_branch: main
  branch_pattern: "^(feat|fix)/{key}-[0-9]+-"
  merge_strategy: merge  # merge | squash | rebase — squash/rebase discard branch shas,
                         # so QA verdicts anchor by VERIFIED-AT (stale_verdict falls back to it)
  hooks: managed         # managed: vteam owns .githooks/pre-push · external: repo has real branch protection
  code_paths: [src/]     # "product code" for the review fence + stale-verdict scans,
                         # and the scan roots of the code map (code_map.py, with
                         # paths.specs) — the map needs this key, it adds none of its own

tracker:
  provider: markdown     # jira | github | markdown (offline backlog, zero services); linear: roadmap
                         # init validates this — unshipped providers are rejected at install
  done_statuses: [Done, Closed, Resolved]
  review_status: In Review

design:
  provider: none         # figma | none

team:
  size: 1                # 1 is the documented sweet spot. >1 is MACHINE-ENFORCED where it
                         # matters most: log_check reds any ledger without the Actor column
                         # (who = VTEAM_ACTOR env, else `git config user.name`); perf_report
                         # and the board then report per person. WIP limit is still
                         # agent-prose (see DESIGN §7).
                         # (read by agents in prose — no gate enforces it yet; see ROADMAP)
  claim_ttl_hours: 2     # an In Progress claim older than this with no branch/worklog is
                         # ORPHANED. The ONE home of this number (raci.md §2 defers here);
                         # machine-read by `vteam resume`, prose-honored by the PM recovery
                         # lane and dev T0.4
  capacity_per_day: 0.8  # person-days of throughput per calendar working day
  hours_per_day: 8       # a workday = 8 hours; plan costs accept "1.5d" or "12h"
                         # (machine-consumed: schedule_check normalizes hours to days)
  loop_budget_per_day: 4 # machine-consumed: graph_check reds >N dispatches of one item
                         # in one day (MAST 1.5 — termination as a number, not prose)

autonomy:
  level: assisted
  # level — off: every gate waits for you · assisted: asks at merge/close ·
  # full: self-merge/self-close with paper trail
  self_merge: false      # agent may merge its own green PR (only honored at level: full;
                         # read by agents via the rendered workflows, not by a gate)
  exemptions:            # NEVER auto-decided regardless of level
    - real-money
    - legal
    - purchasing
    - credentials
    - data-deletion

review:
  reviewers: 2           # machine-enforced: review_check requires cards R1..RN (+1 high-stakes)
  high_stakes_paths: []          # e.g. ["prisma/schema.prisma", "src/lib/"]
  high_stakes_terms: []          # project vocabulary that means money/irreversibility
  # external:                    # OPTIONAL — cross-model reviewers, by card id.
  #   r2:                        # R2 comes from another tool instead of a Claude agent
  #     command: "codex exec"    # gets the BRIEF on stdin, must print the CARD on stdout
  #                              # (no shell: a string is split on spaces; use a list
  #                              #  ["codex", "exec", "--flag=a b"] for quoted args)
  #     model: "gpt-5-codex"     # RECORDED on the card — never guessed
  #     timeout_s: 300           # optional, default 300
  # The external CLI must be installed and authenticated by YOU. vteam pipes the
  # brief (review-standard.md + the card contract + the diff) on stdin and
  # VALIDATES the card before it counts: an invalid card is never written, so a
  # missing binary or a junk card leaves the push fence shut — never one reviewer
  # short in silence. `node .vteam/scripts/external_review.mjs <TICKET> R2`.

models:
  routing: default       # default → <paths.team>/model-routing.data.yaml; any other value
                         # names an alternative data file in paths.team (or repo-relative)
