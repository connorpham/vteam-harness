<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="One ticket's path through vteam, and every place a machine can refuse it: DoR before DEV, verify plus the push fence before QA, evidence plus a two-anchor verdict before Done, and a loop back when code changes after the verdict.">
  <style>
    .ink   { fill: #1C1F22; }
    .muted { fill: #5A6065; }
    .stage { fill: #FFFFFF; stroke: #C9CBC4; }
    .line  { stroke: #9BA1A7; }
    .gate  { fill: #F7E9E6; stroke: #C03B2B; }
    .gatex { fill: #C03B2B; }
    .done  { fill: #E7F2EB; stroke: #1E7F4F; }
    .donex { fill: #1E7F4F; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #E8E6E1; }
      .muted { fill: #9BA1A7; }
      .stage { fill: #1D2024; stroke: #3A3E43; }
      .line  { stroke: #6B7278; }
      .gate  { fill: #3A231F; stroke: #E4604F; }
      .gatex { fill: #E4604F; }
      .done  { fill: #1D2F25; stroke: #4CB983; }
      .donex { fill: #4CB983; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  </style>

  <text x="24" y="34" class="ink" font-size="17" font-weight="700">One ticket, and every place a machine can say no</text>
  <text x="24" y="56" class="muted" font-size="12.5">Prose can be ignored. An exit code cannot — each red chip below is a script that exits non-zero.</text>

  <!-- arrows -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9BA1A7"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C03B2B"/>
    </marker>
  </defs>

  <!-- stage: BA -->
  <rect x="24" y="92" width="132" height="54" rx="8" class="stage" stroke-width="1.5"/>
  <text x="90" y="117" class="ink" font-size="14.5" font-weight="650" text-anchor="middle">/ba</text>
  <text x="90" y="134" class="muted" font-size="11" text-anchor="middle">spec → backlog</text>

  <!-- gate 1 -->
  <line x1="156" y1="119" x2="182" y2="119" class="line" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="186" y="100" width="96" height="38" rx="6" class="gate" stroke-width="1.5"/>
  <text x="234" y="118" class="gatex mono" font-size="10.5" text-anchor="middle">dor_check</text>
  <text x="234" y="131" class="gatex mono" font-size="9" text-anchor="middle">exit 1</text>
  <text x="234" y="160" class="muted" font-size="10.5" text-anchor="middle">no testable AC,</text>
  <text x="234" y="173" class="muted" font-size="10.5" text-anchor="middle">no spec cite → back</text>

  <!-- stage: DEV -->
  <line x1="282" y1="119" x2="308" y2="119" class="line" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="312" y="92" width="132" height="54" rx="8" class="stage" stroke-width="1.5"/>
  <text x="378" y="117" class="ink" font-size="14.5" font-weight="650" text-anchor="middle">/dev</text>
  <text x="378" y="134" class="muted" font-size="11" text-anchor="middle">branch → code</text>

  <!-- gate 2 -->
  <line x1="444" y1="119" x2="470" y2="119" class="line" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="474" y="100" width="120" height="38" rx="6" class="gate" stroke-width="1.5"/>
  <text x="534" y="118" class="gatex mono" font-size="10.5" text-anchor="middle">/verify + fence</text>
  <text x="534" y="131" class="gatex mono" font-size="9" text-anchor="middle">push refused</text>
  <text x="534" y="160" class="muted" font-size="10.5" text-anchor="middle">no review dossier in the</text>
  <text x="534" y="173" class="muted" font-size="10.5" text-anchor="middle">commit → nothing leaves</text>

  <!-- stage: QA -->
  <line x1="594" y1="119" x2="620" y2="119" class="line" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="624" y="92" width="132" height="54" rx="8" class="stage" stroke-width="1.5"/>
  <text x="690" y="117" class="ink" font-size="14.5" font-weight="650" text-anchor="middle">/qa</text>
  <text x="690" y="134" class="muted" font-size="11" text-anchor="middle">verify from the spec</text>

  <!-- gate 3 -->
  <line x1="756" y1="119" x2="782" y2="119" class="line" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="786" y="100" width="96" height="38" rx="6" class="gate" stroke-width="1.5"/>
  <text x="834" y="118" class="gatex mono" font-size="10.5" text-anchor="middle">evd_check</text>
  <text x="834" y="131" class="gatex mono" font-size="9" text-anchor="middle">2 anchors</text>
  <text x="834" y="160" class="muted" font-size="10.5" text-anchor="middle">blank screenshot,</text>
  <text x="834" y="173" class="muted" font-size="10.5" text-anchor="middle">unpinned verdict → red</text>

  <!-- Done -->
  <line x1="882" y1="119" x2="904" y2="119" class="line" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="856" y="196" width="80" height="34" rx="8" class="done" stroke-width="1.5"/>
  <text x="896" y="218" class="donex" font-size="13" font-weight="650" text-anchor="middle">Done</text>
  <path d="M908,128 L908,196" class="line" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- stale-verdict loop back -->
  <path d="M856,213 L400,213 Q378,213 378,191 L378,152" stroke="#C03B2B" stroke-width="1.5" fill="none"
        stroke-dasharray="5 4" marker-end="url(#ad)"/>
  <text x="620" y="205" class="gatex mono" font-size="10.5" text-anchor="middle">stale_verdict_check</text>
  <text x="620" y="234" class="muted" font-size="11" text-anchor="middle">the code changed after the verdict → the verdict expired, the ticket comes back</text>

  <!-- footer law -->
  <text x="24" y="286" class="ink" font-size="12.5" font-weight="650">Every one of these chips ships a <tspan class="mono" font-size="11.5">--selftest</tspan> that feeds it a violating input and proves it goes red.</text>
  <text x="24" y="306" class="muted" font-size="12">A gate that has never been red does not exist — it gets fixed or deleted.</text>
</svg>
