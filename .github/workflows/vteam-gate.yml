name: vteam gate
on: [push, pull_request]
# least privilege: the gate only READS the repo. Actions are pinned by full
# SHA (the tag is a comment) — tags are mutable, a repo's supply chain should
# not hinge on one. Enable Dependabot for github-actions to keep pins fresh.
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      - run: pip install pillow
      - run: bash .vteam/scripts/gate.sh
