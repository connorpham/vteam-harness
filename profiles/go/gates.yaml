# go profile — go.mod projects (field-trial finding #19: a Go repo on the
# generic profile went green having run zero verification).
steps:
  docs-shrink:
    run: "bash .vteam/scripts/docs_shrink_check.sh"
  ledger:
    run: "python3 .vteam/scripts/log_check.py"
  evd:
    # `/qa` names evd_check a dozen times and the gate never ran it, so a pack could ship a
    # REPORT.md claiming ten test cases with zero case folders — which happened in the field
    # trial and took a challenger agent to notice. Sweep mode reads the expected count from
    # each report's own TC citations, errors only on CLOSED tickets, and treats packs older
    # than the KIND standard as warnings. `requires` is a literal path because gate.py only
    # substitutes {package_manager} and {project.key}; a repo that renames its evidence
    # directory gets a declared skip rather than a false red.
    run: "python3 .vteam/scripts/evd_check.py --sweep"
    requires: "evd"
    skip_reason: "no evd/ directory — no verdict has been recorded on this repo"
  verbatim:
    run: "python3 .vteam/scripts/verbatim_gate.py"
  competencies:
    run: "python3 .vteam/scripts/competency_check.py"
  doctrine-source:
    # VT-19 shipped a doctrine change whose INDEX was never regenerated AT THE SOURCE,
    # and a consuming repo's gate went RED the moment it ran `vteam update`: the
    # competency file arrived fresh, the INDEX arrived stale. The reason is that
    # `--write-index` writes {paths.team} — the DEPLOYED mirror — so in the framework
    # repo it can never reach core/doctrine, which is the copy that actually ships.
    # `requires` keeps this step out of consumer repos, which have no core/doctrine.
    run: "python3 .vteam/scripts/competency_check.py --root core/doctrine/competencies"
    requires: "core/doctrine/competencies"
    skip_reason: "no core/doctrine — this repo consumes the doctrine, it does not publish it"
  parallel:
    run: "python3 .vteam/scripts/parallel_check.py"
  coord:
    run: "python3 .vteam/scripts/coord_check.py"
  bdd-report:
    run: "python3 .vteam/scripts/bdd_report_check.py"
  vet:
    run: "go vet ./..."
    requires: "go.mod"
    skip_reason: "no go.mod — wrong profile?"
  unit:
    run: "go test ./..."
    requires: "go.mod"
    skip_reason: "no go.mod — wrong profile?"
  build:
    run: "go build ./..."
    requires: "go.mod"
    skip_reason: "no go.mod — wrong profile?"
  race:
    run: "go test -race ./..."
    tail: true
