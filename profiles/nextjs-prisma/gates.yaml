# nextjs-prisma profile — the source harness's native stack, ported step for step.
# Ordering constraints are real: `typegen` must precede `types`; `token-check`
# must FOLLOW `build` (it reads the built CSS chunks).
# TRUST BOUNDARY: every `run` below executes as a shell command from the repo
# root (like package.json scripts). Repo write access = execute access here —
# review changes to this file as code, high-stakes in PRs.
steps:
  docs-shrink:
    run: "bash .vteam/scripts/docs_shrink_check.sh"
  ledger:
    run: "python3 .vteam/scripts/log_check.py"
  evd:
    # `/qa` names evd_check a dozen times and the gate never ran it, so a pack could ship a
    # REPORT.md claiming ten test cases with zero case folders — which happened in the field
    # trial and took a challenger agent to notice. Sweep mode reads the expected count from
    # each report's own TC citations, errors only on CLOSED tickets, and treats packs older
    # than the KIND standard as warnings. `requires` is a literal path because gate.py only
    # substitutes {package_manager} and {project.key}; a repo that renames its evidence
    # directory gets a declared skip rather than a false red.
    run: "python3 .vteam/scripts/evd_check.py --sweep"
    requires: "evd"
    skip_reason: "no evd/ directory — no verdict has been recorded on this repo"
  graph:
    run: "python3 .vteam/scripts/graph_check.py"
  verbatim:
    run: "python3 .vteam/scripts/verbatim_gate.py"
  competencies:
    run: "python3 .vteam/scripts/competency_check.py"
  doctrine-source:
    # VT-19 shipped a doctrine change whose INDEX was never regenerated AT THE SOURCE,
    # and a consuming repo's gate went RED the moment it ran `vteam update`: the
    # competency file arrived fresh, the INDEX arrived stale. The reason is that
    # `--write-index` writes {paths.team} — the DEPLOYED mirror — so in the framework
    # repo it can never reach core/doctrine, which is the copy that actually ships.
    # `requires` keeps this step out of consumer repos, which have no core/doctrine.
    run: "python3 .vteam/scripts/competency_check.py --root core/doctrine/competencies"
    requires: "core/doctrine/competencies"
    skip_reason: "no core/doctrine — this repo consumes the doctrine, it does not publish it"
  parallel:
    run: "python3 .vteam/scripts/parallel_check.py"
  coord:
    run: "python3 .vteam/scripts/coord_check.py"
  bdd-report:
    run: "python3 .vteam/scripts/bdd_report_check.py"
  lockfile:
    run: "bash .vteam/scripts/lockfile_check.sh"
  prisma-generate:
    run: "npx prisma generate"
    requires: "prisma/schema.prisma"
    skip_reason: "no prisma/schema.prisma — wrong profile? use `node`"
  lint:
    run: "{package_manager} run lint"
  typegen:
    run: "npx next typegen"
  types:
    run: "npx tsc --noEmit"
  unit:
    run: "{package_manager} test"
    # Probe (run silently): package.json must declare scripts.test AND it must
    # not be an obvious no-op (echo / true / exit 0). This is a TRIPWIRE, not
    # proof — a cleverer fake still passes it; only a real suite is verification.
    requires_cmd: node -e 'const s=(require("./package.json").scripts||{}).test;if(!s||/^\s*(echo|true|exit 0)\b/.test(s))process.exit(1)'
    skip_reason: "no real test script — the repo ships with ZERO verification until one exists (loud)"
  build:
    run: "{package_manager} run build"
  token-check:
    run: "node .vteam/profiles/nextjs-prisma/scripts/token_check.mjs"
    requires: ".vteam/profiles/nextjs-prisma/scripts/token_check.mjs"
    skip_reason: "token_check plugin not installed (Tailwind v4 CSS reality check)"
  integration:
    run: "{package_manager} run test:integration"
    # Probed, not assumed: many repos never adopt a separate integration suite, and an
    # unguarded step made `gate e2e` die HERE — one step before e2e — so the e2e step
    # it exists to reach never ran on any ticket. A declared skip is the contract.
    requires_cmd: node -e 'const s=(require("./package.json").scripts)||{};process.exit(s["test:integration"]?0:1)'
    skip_reason: "no test:integration script in package.json — integration suite not adopted on this repo"
    tail: true
  e2e:
    run: "{package_manager} run test:e2e"
    requires_cmd: node -e 'const s=(require("./package.json").scripts)||{};process.exit(s["test:e2e"]?0:1)'
    skip_reason: "no test:e2e script in package.json — no end-to-end suite on this repo"
    tail: true
